# Vhost για audit.skotanislaw.gr — reverse proxy προς το Nomos Audit
# (127.0.0.1:8080). Το certbot αναβαθμίζει αυτό το block σε HTTPS
# (certbot --nginx -d audit.skotanislaw.gr).
server {
    listen 80;
    server_name audit.skotanislaw.gr;

    client_max_body_size 30m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        # SSE (ροή προόδου ανάλυσης): χωρίς buffering, με γενναιόδωρο timeout
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
