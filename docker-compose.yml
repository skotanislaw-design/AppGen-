services:
  api:
    build: ./backend
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - NOMOS_AUDIT_MODEL=${NOMOS_AUDIT_MODEL:-claude-opus-4-8}
      - NOMOS_AUDIT_API_KEY=${NOMOS_AUDIT_API_KEY:-}
      - NOMOS_AUDIT_CORS_ORIGINS=${NOMOS_AUDIT_CORS_ORIGINS:-http://localhost:8080}
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Το frontend μιλά στο /api μέσω του nginx του ίδιου container
        VITE_API_URL: ""
    ports:
      # Δένεται μόνο στο loopback — δημόσια έκθεση γίνεται αποκλειστικά μέσω
      # του TLS reverse proxy του server (βλ. deploy/).
      - "127.0.0.1:${NOMOS_AUDIT_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped
